name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Extract version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python -c "
          import re, pathlib
          p = pathlib.Path('core/version.py')
          t = p.read_text(encoding='utf-8')
          t = re.sub(r'^VERSION\s*=.*', 'VERSION = \"$VERSION\"', t, count=1, flags=re.M)
          p.write_text(t, encoding='utf-8')
          "

      - name: Build exe
        run: python tools/build_exe.py

      - name: Package release
        run: python tools/release.py --skip-build --version ${{ env.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/*.zip
            dist/releases/manifest.json
            updates/manifest.json
          generate_release_notes: true
